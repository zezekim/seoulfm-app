# Every push and pull request: format, analyze, unit tests, then both apps build.
# The walkthrough tests in integration_test/ need a device and the live API; run them before
# a release (see README).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Run by hand with "update goldens" to redraw the golden images on the macOS runner and download
  # them as an artifact (docs/golden-tests.md).
  workflow_dispatch:
    inputs:
      update_goldens:
        description: Redraw the golden images and upload them
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.5

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      # Golden tests run here too, for layout (overflow, direction) only: their images are
      # compared in the goldens job, on macOS, where they were rendered.
      - run: flutter test

  # Screen snapshots in six languages (test/goldens): pixel comparison on macOS (docs/golden-tests.md).
  goldens:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - if: ${{ !inputs.update_goldens }}
        run: flutter test --tags golden
      - if: ${{ inputs.update_goldens }}
        run: flutter test --tags golden --update-goldens
      - if: ${{ inputs.update_goldens }}
        uses: actions/upload-artifact@v4
        with:
          name: golden-images
          path: test/goldens/images/
      # What differed: the expected, actual and diff images of each failed golden.
      - if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: golden-failures
          path: test/goldens/failures/

  android:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      # Built without keys: the app builds and runs; the API answers 401 until a key is set.
      - run: flutter build apk --debug --dart-define=GIT_COMMIT=${GITHUB_SHA::7}

  ios:
    needs: check
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      # Plugins build against the current iOS SDK (connectivity_plus uses iOS 26 API): not the image's default Xcode.
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter build ios --simulator --debug --dart-define=GIT_COMMIT=${GITHUB_SHA::7}
