# A version tag (v3.0.1) builds both apps and uploads them: Android to Play's internal track,
# iOS to TestFlight. Promotion to the stores stays manual (docs/release.md). Secrets only.
name: Release

on:
  push:
    tags: ['v*.*.*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.47.5
  RUBY_VERSION: '3.4'
  FASTLANE_OPT_OUT_USAGE: '1'
  FASTLANE_SKIP_UPDATE_CHECK: '1'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # The tag names the version the stores will show: it must be pubspec's.
      - name: Tag matches pubspec.yaml
        run: |
          version=$(sed -nE 's/^version: *([^+ ]+).*/\1/p' pubspec.yaml)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match pubspec.yaml's version $version"
            exit 1
          fi
      - run: python3 store/check_store.py
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  android:
    needs: check
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: true
      # The upload key and the build's defines exist only for this job (both paths are gitignored).
      - name: Write signing and build config
        env:
          DART_DEFINES_JSON: ${{ secrets.DART_DEFINES_JSON }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          printf '%s' "$DART_DEFINES_JSON" > dart-defines.json
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          {
            echo "storeFile=$RUNNER_TEMP/upload.jks"
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
          } > android/key.properties
      - run: flutter pub get
      - name: Build and upload to the internal track
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: GIT_COMMIT=${GITHUB_SHA::7} bundle exec fastlane android internal
      # Symbols for crash reports from this obfuscated build (skipped until Sentry is set up).
      - name: Upload symbols to Sentry
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
        run: |
          if [ -z "$SENTRY_AUTH_TOKEN" ]; then echo "No SENTRY_AUTH_TOKEN: skipped"; exit 0; fi
          dart run sentry_dart_plugin --sentry-define=dist=${GITHUB_SHA::7}
      - uses: actions/upload-artifact@v4
        with:
          name: android-bundle
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 30
      - name: Remove secrets
        if: always()
        run: rm -f android/key.properties "$RUNNER_TEMP/upload.jks" dart-defines.json

  ios:
    needs: check
    runs-on: macos-15
    environment: release
    steps:
      - uses: actions/checkout@v5
      # App Store uploads must be built with a current Xcode and SDK, not the image's default.
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: true
      - name: Write build config
        env:
          DART_DEFINES_JSON: ${{ secrets.DART_DEFINES_JSON }}
        run: printf '%s' "$DART_DEFINES_JSON" > dart-defines.json
      - run: flutter pub get
      # Automatic signing through the App Store Connect API key: Xcode fetches or creates the
      # distribution certificate (cloud-managed) and the profiles itself, so nothing is stored
      # in the keychain beforehand.
      - name: Build and upload to TestFlight
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: GIT_COMMIT=${GITHUB_SHA::7} bundle exec fastlane ios beta
      # Symbols for crash reports from this obfuscated build (skipped until Sentry is set up).
      - name: Upload symbols to Sentry
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
        run: |
          if [ -z "$SENTRY_AUTH_TOKEN" ]; then echo "No SENTRY_AUTH_TOKEN: skipped"; exit 0; fi
          dart run sentry_dart_plugin --sentry-define=dist=${GITHUB_SHA::7}
      - uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: build/ios/ipa/*.ipa
          retention-days: 30
      - name: Remove secrets
        if: always()
        run: rm -f dart-defines.json
